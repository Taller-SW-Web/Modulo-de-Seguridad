      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReenviarCambioMfa'
            examples:
              valido:
                value:
                  mfaChangeToken: cambio-opaco-ejemplo-no-utilizable
      responses:
        '400':
          description: VALIDACION
          content:
            application/problem+json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/Problem
              examples:
                validacion:
                  value:
                    type: https://g7.unmsm.pe/errores/validacion
                    title: Validacion
                    status: 400
                    code: VALIDACION
        '401':
          description: TOKEN_INVALIDO
          content:
            application/problem+json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/Problem
              examples:
                token_invalido:
                  value:
                    type: https://g7.unmsm.pe/errores/token-invalido
                    title: Token invalido
                    status: 401
                    code: TOKEN_INVALIDO
        '403':
          description: TOKEN_NO_APLICABLE
          content:
            application/problem+json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/Problem
              examples:
                token_no_aplicable:
                  value:
                    type: https://g7.unmsm.pe/errores/token-no-aplicable
