openapi: 3.1.0
info:
  title: Seguridad — evolución parcial v2
  version: 2.1.0
  x-estado: publicada-parcial
  description: |-
    Edición local delegada por Sergio según autorización comunicada por Luis David.
    Solo configuración MFA segura y alta administrativa estricta. Login, OTP de
    login, refresh, activación de cuenta, consultas y JWKS permanecen en v1.
    No hay issuer ni audiencia de usuario nuevos. Publicación sujeta a ADR-003;
    no se presume aceptación de consumidores ni disponibilidad en nube.
    Las rutas MFA v1 incompletas no se despliegan; base 1.0.0 en historico/.
    2.1.0 (lote de contrato H5, 10-nov-2026): añade la gestión de clientes técnicos
    de SPEC-19 en /clientes-servicio y /scopes. Es aditivo: ninguna ruta anterior
    cambia y los módulos consumidores no usan estas rutas, que son de administración.
servers:
- url: http://localhost:8080/api/v2
  description: Implementación futura local; no confirma despliegue
- url: http://localhost:4011
  description: Mock documental; no verifica firmas ni persistencia
security:
- tokenUsuario: []
paths:
  /auth/mfa/cambios:
    post:
      tags:
      - Segundo factor
      operationId: solicitarCambioMfaV2
      summary: Solicita cambio MFA
      description: |-
        SPEC-10. Token de acceso del titular y sesión vigente. El servidor resuelve
        usuario, correo y acción; la petición no admite usuarioId, destino ni propósito.
        mfaChangeToken es opaco, almacenado por hash y vinculado a usuario, familia de
        sesión y acción. No es challengeToken ni JWT de acceso. Validar identidad,
        sesión y operación antes del código; sin filtraciones en logs/errores.
        Cambio: 600 s; OTP: 300 s; confirmar exige ambos vigentes. Un cambio pendiente
        por usuario. Reenvío invalida OTP anterior y no extiende cambio. Tres intentos
        por código; tres envíos por usuario en 15 min compartidos con login.
        Ya en el estado pedido: 400 VALIDACION sin envío. Cualquier rol de gestión
        impide desactivar: 422 MFA_OBLIGATORIO. Revalidar cuenta, roles y familia al
        confirmar. Token de servicio: 403 TOKEN_NO_APLICABLE; operación consumida,
        vencida, de otra cuenta/familia: 401 TOKEN_INVALIDO.
        Persistir consumo, estado y auditoría crítica atómicamente; fallo de auditoría
        503 NO_DISPONIBLE, sin cambio. Confirmar no crea ni renueva sesión.
        JWT nuevo por refresh en la misma familia conserva vínculo. No se admite un
        JWT de otra sesión aunque pertenezca al mismo usuario. No se cambia el JWT
        público: la relación jti-familia se resuelve internamente (DAT-01).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitarCambioMfa'
            examples:
              valido:
                value:
                  accion: HABILITAR
      responses:
        '400':
          description: VALIDACION
          content:
            application/problem+json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/Problem
              examples:
                validacion:
                  value:
                    type: https://g7.unmsm.pe/errores/validacion
                    title: Validacion
                    status: 400
                    code: VALIDACION
        '401':
          description: TOKEN_INVALIDO
          content:
            application/problem+json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/Problem
              examples:
                token_invalido:
                  value:
                    type: https://g7.unmsm.pe/errores/token-invalido
                    title: Token invalido
                    status: 401
                    code: TOKEN_INVALIDO
        '403':
          description: TOKEN_NO_APLICABLE
          content:
            application/problem+json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/Problem
              examples:
                token_no_aplicable:
                  value:
                    type: https://g7.unmsm.pe/errores/token-no-aplicable
                    title: Token no aplicable
                    status: 403
                    code: TOKEN_NO_APLICABLE
        '422':
          description: MFA_OBLIGATORIO
          content:
            application/problem+json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/Problem
              examples:
                mfa_obligatorio:
                  value:
                    type: https://g7.unmsm.pe/errores/mfa-obligatorio
                    title: Mfa obligatorio
                    status: 422
                    code: MFA_OBLIGATORIO
        '429':
          description: DEMASIADAS_SOLICITUDES
          content:
            application/problem+json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/Problem
              examples:
                demasiadas_solicitudes:
                  value:
                    type: https://g7.unmsm.pe/errores/demasiadas-solicitudes
                    title: Demasiadas solicitudes
                    status: 429
                    code: DEMASIADAS_SOLICITUDES
          headers:
            Retry-After:
              $ref: ./openapi.yaml#/components/headers/RetryAfter
        '503':
          description: NO_DISPONIBLE
          content:
            application/problem+json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/Problem
              examples:
                no_disponible:
                  value:
                    type: https://g7.unmsm.pe/errores/no-disponible
                    title: No disponible
                    status: 503
                    code: NO_DISPONIBLE
        '202':
          description: Código enviado; el estado MFA todavía no cambia
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CambioMfaSolicitado'
              examples:
                enviado:
                  value:
                    mfaChangeToken: cambio-opaco-ejemplo-no-utilizable
                    canal: EMAIL
                    destinoEnmascarado: m****a@ejemplo.com
                    expiraEn: 300
                    cambioExpiraEn: 600
  /auth/mfa/cambios/reenviar:
    post:
      tags:
      - Segundo factor
      operationId: reenviarCambioMfaV2
      summary: Reenvía código del cambio MFA
      description: |-
        SPEC-10. Token de acceso del titular y sesión vigente. El servidor resuelve
        usuario, correo y acción; la petición no admite usuarioId, destino ni propósito.
        mfaChangeToken es opaco, almacenado por hash y vinculado a usuario, familia de
        sesión y acción. No es challengeToken ni JWT de acceso. Validar identidad,
        sesión y operación antes del código; sin filtraciones en logs/errores.
        Cambio: 600 s; OTP: 300 s; confirmar exige ambos vigentes. Un cambio pendiente
        por usuario. Reenvío invalida OTP anterior y no extiende cambio. Tres intentos
        por código; tres envíos por usuario en 15 min compartidos con login.
        Ya en el estado pedido: 400 VALIDACION sin envío. Cualquier rol de gestión
